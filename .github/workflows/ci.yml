name: CI

on:
  push:
    branches: [main, master]
    tags-ignore:
      - 'v*'
  pull_request:
    branches: [main, master]

jobs:
  rust:
    name: Rust Tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo test
        run: cargo test --tests

      - name: cargo clippy
        run: cargo clippy --tests -- -W clippy::all

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        # Yukarı akışta düzeltmesi olmayan danışmanlıklar hariç tutulur:
        #   RUSTSEC-2026-0187  lopdf  (pdf-extract/printpdf sabitlediği için kaldı)
        #   RUSTSEC-2026-0194/195 quick-xml (docx-rs 0.36'yı sabitlediği için kaldı;
        #                        kendi kullanımımız 0.38.4'e yükseltildi)
        #   RUSTSEC-2026-0235  rkyv 0.7 (en güncel 0.7 sürümü)
        #   RUSTSEC-2026-0285  rustls 0.23.43 (0.23.45 bağımlı MSRV yüzünden kilitli)
        # Bu kitaplıklar yalnızca kullanıcının kendi seçtiği yerel dosyalarını okur.
        run: cargo audit --ignore RUSTSEC-2026-0187 --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195 --ignore RUSTSEC-2026-0235 --ignore RUSTSEC-2026-0285

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: npm ci
        run: npm ci

      - name: npm run build
        run: npm run build