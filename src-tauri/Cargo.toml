[package]
name = "kukla"
version = "0.2.0"
description = "Kukla - AI-powered legal precedent search for attorneys"
authors = ["Erhan"]
license = "MIT"
edition = "2021"
rust-version = "1.80.0"

[lib]
name = "kukla_lib"
# rlib only: cdylib breaks `cargo test` on Windows (STATUS_ENTRYPOINT_NOT_FOUND)
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["zeroize_derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "blocking", "cookies", "stream"] }
open = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
dirs-next = "2.0"
pdf-extract = "0.7"
time = { version = "0.3", features = ["parsing"] }
bincode = "1.3"
docx-rs = "0.4"
printpdf = "0.7"

# Yerel embedding: Candle + all-MiniLM-L6-v2 (384 boyut, CPU)
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
safetensors = "0.8"

# Dosya dönüştürücü: UDF (UYAP) ve DOCX arşivlerini okumak için
zip = "2"
quick-xml = "0.37"

# Bulut YZ sağlayıcıları: OpenAI uyumlu SSE akışı
futures-util = "0.3"

